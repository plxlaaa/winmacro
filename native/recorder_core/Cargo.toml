[package]
name = "recorder_core"
version = "1.1.0"
edition = "2021"
description = "High-performance Windows keyboard/mouse record and playback core"

[lib]
name = "recorder_core"
crate-type = ["cdylib", "lib"]

[dependencies]
once_cell = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }
