[package]
name = "winmacro-app"
version = "2.2.0"
description = "WinMacro — Windows macro recorder & player (Tauri backend)"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winmacro-logic = { path = "../logic" }
recorder_core = { path = "../../native/recorder_core" }

[profile.release]
strip = true
lto = true
