name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json
      - run: npm ci
      - run: npm run test:js
      - run: npm run build

  python-tests:
    name: Python tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -v

  rust-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --manifest-path native/recorder_core/Cargo.toml --verbose
      - name: Run domain tests
        run: cargo test --manifest-path app-tauri/logic/Cargo.toml --locked

  rust-check-windows:
    name: Rust core check (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        run: cargo check --manifest-path native/recorder_core/Cargo.toml --all-targets
      - name: Check Tauri backend
        run: cargo check --manifest-path app-tauri/src-tauri/Cargo.toml --locked --all-targets
