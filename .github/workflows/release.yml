name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build native core (release)
        run: cargo build --release --manifest-path native/recorder_core/Cargo.toml

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build application (PyInstaller onedir)
        run: pyinstaller installer/winmacro.spec --noconfirm --distpath build/app

      - name: Stage native DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/app/WinMacro/bin | Out-Null
          Copy-Item native/recorder_core/target/release/recorder_core.dll build/app/WinMacro/bin/

      - name: Read version from pyproject
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { $makensis = "makensis" }
          & $makensis /VERSION
          New-Item -ItemType Directory -Force dist | Out-Null
          & $makensis -DVERSION=${{ steps.ver.outputs.version }} -DPAYLOAD=build/app/WinMacro -DOUTDIR=dist installer/winmacro.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinMacro-Setup-${{ steps.ver.outputs.version }}
          path: dist/WinMacro-Setup-*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WinMacro-Setup-*.exe
