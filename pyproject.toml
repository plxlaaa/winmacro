[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winmacro"
version = "1.0.0"
description = "Windows script recorder and player with a native desktop UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "pynput>=1.7.6",
]

[project.scripts]
winmacro = "winmacro.app:main"

[tool.setuptools.packages.find]
include = ["winmacro*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
